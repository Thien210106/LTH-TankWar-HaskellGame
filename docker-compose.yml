services:
  mongo:
    image: mongo:latest
    container_name: tankwar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tankwar-server
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    command: [ "--port", "8080", "--mongo-uri", "mongodb://mongo:27017/TankWar" ]

  web:
    image: nginx:alpine
    container_name: tankwar-web
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo_data:
