name:                tankwar
version:             0.1.0.0
synopsis:            "TankWar - Online Multiplayer Tank Battle Game"
description:         "A 2D top-down tank battle game with online multiplayer, mystery boxes, and MongoDB persistence."
license:             MIT
author:              "TankWar Team"

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DeriveAnyClass
  - RecordWildCards
  - ScopedTypeVariables
  - LambdaCase
  - TupleSections
  - BangPatterns

dependencies:
  - base >= 4.14 && < 5
  - aeson >= 2.0
  - text >= 1.2
  - bytestring >= 0.10
  - containers >= 0.6
  - unordered-containers >= 0.2

library:
  source-dirs: src
  exposed-modules:
    - Common.Types
    - Common.Config
    - Common.Protocol

executables:
  tankwar-server:
    main:          Main.hs
    source-dirs:   server
    ghc-options:
      - -threaded
      - -rtsopts
      - "-with-rtsopts=-N"
      - -O2
    other-modules:
      - Server.State
      - Server.RoomManager
      - Server.GameEngine
      - Server.Database.Connection
      - Server.Database.PlayerRepo
      - Server.Database.MatchRepo
    dependencies:
      - tankwar
      - websockets >= 0.12
      - stm >= 2.5
      - mongoDB >= 2.7
      - bson >= 0.4
      - random >= 1.2
      - time >= 1.9
      - network >= 3.1
      - async >= 2.2
      - mtl >= 2.2
